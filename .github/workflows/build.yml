name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install packages
        run: npm install

      - name: Create Android project
        run: npx cap add android

      - name: Make azan tone
        run: |
          mkdir -p android/app/src/main/res/raw
          python3 - <<'PY'
          import wave, struct, math
          sr = 22050
          phrase = [(293.66,.6),(311.13,.5),(369.99,.5),(392.0,.9),(440.0,1.5),(392.0,.5),(369.99,.5),(311.13,.5),(293.66,1.9)]
          total = int((sum(d for _, d in phrase) * 2 + 3.5) * sr)
          mix = [0.0] * total
          pos = 0
          for rep in range(2):
              for f, d in phrase:
                  for i in range(int((d + 0.6) * sr)):
                      t = i / sr
                      env = min(1.0, t / 0.05) * math.exp(-2.5 * t / (d + 0.3))
                      v = env * (0.55 * math.sin(2 * math.pi * f * t) + 0.18 * math.sin(4 * math.pi * f * t))
                      if pos + i < total:
                          mix[pos + i] += v
                  pos += int(d * sr)
              pos += int(1.2 * sr)
          dl = int(0.27 * sr)
          for i in range(dl, total):
              mix[i] += 0.3 * mix[i - dl]
          peak = max(abs(x) for x in mix) or 1.0
          w = wave.open('android/app/src/main/res/raw/azan.wav', 'wb')
          w.setnchannels(1)
          w.setsampwidth(2)
          w.setframerate(sr)
          w.writeframes(b''.join(struct.pack('<h', int(x / peak * 30000)) for x in mix))
          w.close()
          PY

      - name: Add permissions
        run: |
          sed -i 's#</manifest>#<uses-permission android:name="android.permission.POST_NOTIFICATIONS" /><uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" android:maxSdkVersion="32" /><uses-permission android:name="android.permission.USE_EXACT_ALARM" /><uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" /><uses-permission android:name="android.permission.VIBRATE" /></manifest>#' android/app/src/main/AndroidManifest.xml

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Publish APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: APK ${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
