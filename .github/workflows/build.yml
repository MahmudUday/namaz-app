name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install packages
        run: npm install

      - name: Create Android project
        run: npx cap add android

      - name: Make azan tone
        run: |
          mkdir -p android/app/src/main/res/raw
          python3 - <<'PY'
          import wave, struct, math
          sr = 24000
          # Original bright bell-like notification melody; not Adhan audio.
          phrase = [(392.00,.42),(493.88,.42),(587.33,.52),(783.99,.72),
                    (659.25,.42),(587.33,.42),(493.88,.52),(392.00,.82)]
          samples = []
          for repeat in range(2):
              for freq, duration in phrase:
                  count = int(duration * sr)
                  for i in range(count):
                      t = i / sr
                      attack = min(1.0, t / 0.018)
                      decay = math.exp(-2.15 * t / duration)
                      env = attack * decay
                      fundamental = math.sin(2 * math.pi * freq * t)
                      second = math.sin(2 * math.pi * freq * 2 * t)
                      third = math.sin(2 * math.pi * freq * 3 * t)
                      fourth = math.sin(2 * math.pi * freq * 4 * t)
                      samples.append(env * (0.62 * fundamental + 0.25 * second + 0.10 * third + 0.035 * fourth))
                  samples.extend([0.0] * int(0.055 * sr))
              samples.extend([0.0] * int(0.42 * sr))
          delay = int(0.19 * sr)
          dry = samples[:]
          for i in range(delay, len(samples)):
              samples[i] += 0.22 * dry[i - delay]
          peak = max(abs(x) for x in samples) or 1.0
          with wave.open('android/app/src/main/res/raw/azan.wav', 'wb') as out:
              out.setnchannels(1)
              out.setsampwidth(2)
              out.setframerate(sr)
              out.writeframes(b''.join(struct.pack('<h', int(max(-1.0, min(1.0, x / peak * 0.94)) * 32767)) for x in samples))
          PY


      - name: Create Waqt app icon
        run: |
          mkdir -p android/app/src/main/res/drawable
          mkdir -p android/app/src/main/res/mipmap-anydpi-v26
          cat > android/app/src/main/res/drawable/ic_waqt_launcher.xml <<'XML'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#101B35" android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="#D9B76A" android:pathData="M54,12a26,26 0,1 0,0 52a21,21 0,1 1,0 -52z"/>
              <path android:fillColor="#F2D58A" android:pathData="M54,18a1.8,1.8 0,1 0,0 3.6a1.8,1.8 0,1 0,0 -3.6M76,29a1.3,1.3 0,1 0,0 2.6a1.3,1.3 0,1 0,0 -2.6"/>
              <path android:fillColor="#E8C979" android:pathData="M18,83h72v7h-72zM25,83V56l8,-9 8,9v27zM29,57h8v26h-8zM45,83V43l9,-11 9,11v40zM50,47h8v36h-8zM68,83V56l8,-9 8,9v27zM72,57h8v26h-8z"/>
              <path android:fillColor="#101B35" android:pathData="M30,61h5v8h-5zM51,53h6v9h-6zM73,61h5v8h-5z"/>
              <path android:fillColor="#F2D58A" android:pathData="M54,36a1.5,1.5 0,1 0,0 3a1.5,1.5 0,1 0,0 -3M53,37h2v13h-2z"/>
              <path android:fillColor="#F2D58A" android:pathData="M54,49l10,6 -1.8,2.4 -9.7,-7z"/>
          </vector>
          XML
          cat > android/app/src/main/res/drawable/ic_waqt_background.xml <<'XML'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#101B35" android:pathData="M0,0h108v108h-108z"/>
          </vector>
          XML
          cat > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'XML'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_waqt_background"/>
              <foreground android:drawable="@drawable/ic_waqt_launcher"/>
          </adaptive-icon>
          XML
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml')
          s=p.read_text()
          s=s.replace('android:icon="@mipmap/ic_launcher"', 'android:icon="@drawable/ic_waqt_launcher"')
          s=s.replace('android:roundIcon="@mipmap/ic_launcher_round"', 'android:roundIcon="@drawable/ic_waqt_launcher"')
          p.write_text(s)
          PY

      - name: Add permissions
        run: |
          sed -i 's#</manifest>#<uses-permission android:name="android.permission.POST_NOTIFICATIONS" /><uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" /><uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" /><uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" android:maxSdkVersion="32" /><uses-permission android:name="android.permission.USE_EXACT_ALARM" /><uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" /><uses-permission android:name="android.permission.VIBRATE" /></manifest>#' android/app/src/main/AndroidManifest.xml

      - name: Configure stable APK signing (optional but recommended)
        env:
          WAQT_KEYSTORE_BASE64: ${{ secrets.WAQT_KEYSTORE_BASE64 }}
          WAQT_KEYSTORE_PASSWORD: ${{ secrets.WAQT_KEYSTORE_PASSWORD }}
          WAQT_KEY_ALIAS: ${{ secrets.WAQT_KEY_ALIAS }}
          WAQT_KEY_PASSWORD: ${{ secrets.WAQT_KEY_PASSWORD }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          python3 - <<'PY'
          import os, base64, re
          from pathlib import Path
          p = Path('android/app/build.gradle')
          s = p.read_text()
          run_number = os.environ.get('GITHUB_RUN_NUMBER', '1')
          s = re.sub(r'versionCode\s+\d+', 'versionCode ' + run_number, s)
          s = re.sub(r'versionName\s+"[^"]+"', 'versionName "1.5.1"', s)
          encoded = os.environ.get('WAQT_KEYSTORE_BASE64', '')
          if encoded:
              Path('android/app/waqt-upload.jks').write_bytes(base64.b64decode(encoded))
              signing = '''
              signingConfigs {
                  stable {
                      storeFile file("waqt-upload.jks")
                      storePassword System.getenv("WAQT_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("WAQT_KEY_ALIAS")
                      keyPassword System.getenv("WAQT_KEY_PASSWORD")
                  }
              }
              '''
              s = s.replace('    buildTypes {', signing + '\n    buildTypes {')
              s = s.replace('        debug {', '        debug {\n            signingConfig signingConfigs.stable')
              print('Using persistent WAQT signing key.')
          else:
              print('::warning::WAQT signing secrets are not configured; this APK will use a temporary debug key and cannot reliably update an installed APK.')
          p.write_text(s)
          PY

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Publish APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: APK ${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
